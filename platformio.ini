[platformio]
default_envs = esp32, esp8266
src_dir = boxy_robot

[env]
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.cpp> -<camera_standalone.cpp> -<camera_stream.cpp>

[env:esp32]
platform = espressif32
board = esp32dev
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/bblanchon/ArduinoJson.git#7.x
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit NeoPixel@^1.12.0

[env:esp8266]
platform = espressif8266
board = nodemcuv2
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/ESPAsyncTCP.git
    https://github.com/bblanchon/ArduinoJson.git#7.x
    adafruit/Adafruit NeoPixel@^1.12.0

[env:esp32cam_experimental]
extends = env:esp32
board = esp32cam
build_src_filter =
    +<*.cpp>
    -<camera_standalone.cpp>
build_flags =
    -D BOXY_ENABLE_CAMERA=1
    -D BOXY_ENABLE_SERVO=0
    -D BOXY_ENABLE_ULTRASONIC=0
    -D BOXY_ENABLE_IR_SENSORS=0
    -D BOXY_ENABLE_BUZZER=0
    -D BOXY_ENABLE_NEOPIXEL=0
    -D BOXY_ENABLE_STATUS_LED=0
    -D BOXY_PIN_LEFTA=13
    -D BOXY_PIN_LEFTB=14
    -D BOXY_PIN_RIGHTA=15
    -D BOXY_PIN_RIGHTB=12
lib_deps =
    ${env:esp32.lib_deps}
    esp32-camera

[env:esp32cam_streamer_experimental]
extends = env:esp32cam_experimental
build_src_filter =
    -<*>
    +<camera_stream.cpp>
    +<camera_standalone.cpp>
build_flags =
    -D BOXY_ENABLE_CAMERA=1
    -D BOXY_ENABLE_MOTORS=0
    -D BOXY_ENABLE_SERVO=0
    -D BOXY_ENABLE_ULTRASONIC=0
    -D BOXY_ENABLE_IR_SENSORS=0
    -D BOXY_ENABLE_BUZZER=0
    -D BOXY_ENABLE_NEOPIXEL=0
    -D BOXY_ENABLE_STATUS_LED=0
